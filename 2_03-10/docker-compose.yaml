services:
  frontend:
    image: serbrio/frontend
    build:
      context: "${CONTEXT}" 
      dockerfile: ./Dockerfile.frontend
    ports: 
      - "${FRONTEND_PORT}:5001"
  backend:
    image: serbrio/backend
    build:
      context: "${CONTEXT}"
      dockerfile: ./Dockerfile.backend
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - REDIS_HOST=redis
    restart: unless-stopped
  redis:
    image: redis
