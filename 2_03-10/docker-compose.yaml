services:
  frontend:
    image: serbrio/frontend
    build:
      context: "${CONTEXT}" 
      dockerfile: ./Dockerfile.frontend
    ports: 
      - "${FRONTEND_PORT}:5001"
  backend:
    image: serbrio/backend
    build:
      context: "${CONTEXT}"
      dockerfile: ./Dockerfile.backend
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
    restart: unless-stopped
    depends_on:
      - db
  redis:
    image: redis
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./database:/var/lib/postgresql
  nginx:
    image: nginx
    ports:
      - 8000:80
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
